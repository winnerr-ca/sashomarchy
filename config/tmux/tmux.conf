# Prefix (Ctrl+a primary, Ctrl+Space secondary, Ctrl+b fallback)
set -g prefix C-a
set -g prefix2 C-Space
bind-key C-a send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Reload config (r)" r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print 2>/dev/null || tmux list-keys | less"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Faster mouse wheel scrolling (5 lines per tick)
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 5 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 5 scroll-down

# Quick splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" R command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" S command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# ── SESSION CHOOSER WITH LIVE PREVIEWS ─────────────────────────────────────
# Interactive Session Tree Chooser with full window/pane content preview (Prefix s)
bind s choose-tree -Zs
bind w choose-tree -Zw

# ── FLOATING POPUPS & POWER SHORTCUTS ───────────────────────────────────────
# Fuzzy Session Switcher Popup (Prefix C-s)
bind C-s display-popup -w 60% -h 60% -E "~/.tmux/session-switch.sh"

# Floating Scratchpad Terminal (Prefix e)
bind e display-popup -w 85% -h 80% -E "bash"

# Floating Git Status & Log Viewer (Prefix G)
bind G display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "~/.tmux/gitpopup.sh"

# Multi-Repo Git Radar (Prefix D)
bind D display-popup -w 90% -h 85% -E "~/.tmux/git-radar.sh"

# Project Session Jumper (Prefix o)
bind o display-popup -w 70% -h 70% -E "~/.tmux/proj-switch.sh"

# Agent & Pane Switcher with Peek Preview (Prefix Space or Prefix Tab)
bind Space display-popup -w 90% -h 85% -E "~/.tmux/pane-switch.sh"
bind Tab display-popup -w 90% -h 85% -E "~/.tmux/pane-switch.sh"

# Fleet Commander / Broadcast Keystrokes to All Panes (Prefix y)
bind y run-shell "~/.tmux/toggle-broadcast.sh"

# Tile / Untile toggles (Prefix t)
bind t run-shell "~/.tmux/toggle-tile.sh"
bind M run-shell "~/.tmux/tile-windows.sh"
bind m run-shell "~/.tmux/untile-windows.sh"

# Launcher / Dev tools
bind g new-window "~/.tmux/launchpad.sh"
bind R new-window -c "#{pane_current_path}" "~/.tmux/restart-dev.sh"

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events off
set -g set-clipboard on
set -g allow-passthrough off
setw -g aggressive-resize on
set -g detach-on-destroy off

# Status bar (Top Bar)
set -g status on
set -g status-position top
set -g status-interval 3
set -g status-left-length 50
set -g status-right-length 70
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme (Cyberpunk / Sashomarchy Top Bar)
set -g status-style "bg=#040303,fg=#ffffff"
set -g status-left "#[fg=black,bg=#F82A2A,bold] ⚡ #S #[bg=default] #[fg=#FEF348,bold]󱚣 agy #[fg=brightblack]│ "
set -g status-right "#[fg=#F82A2A]#{?pane_in_mode,󰆏 COPY ,}#{?client_prefix,󰌌 PREFIX ,}#{?window_zoomed_flag,󰊓 ZOOM ,}#[fg=#AAACAC] %H:%M #[fg=brightblack]│ #[fg=#FEF348]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=#040303,bg=#AAACAC,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=#F82A2A"
set -g message-style "bg=#040303,fg=#FEF348"
set -g message-command-style "bg=#040303,fg=#FEF348"
set -g mode-style "bg=#F82A2A,fg=black"
setw -g clock-mode-colour "#F82A2A"

# ── SESSION PERSISTENCE (auto-saves every 15 min) ───────────────────────────
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

run-shell "~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
run-shell "~/.tmux/plugins/tmux-continuum/continuum.tmux"